<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Polling Booth System</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo-container">
        <img src="./images/images.png" alt="Logo" class="logo">
        <h1>Polling Booth System</h1>
      </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html" class="active">Signup</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <section class="signup-section">
        <h2>Voting System Registration</h2>
        <form action="signup.php" method="POST" id="signup-form">
          <div class="form-group">
            <label for="voter_id">Enter Voter ID:</label>
            <input type="text" id="voter_id" name="voter_id" placeholder="Voter ID" required>
          </div>
          <div class="form-group">
            <label for="aadhaar">Aadhar Card Number:</label>
            <input type="number" id="aadhaar" name="aadhaar" placeholder="Aadhar Card Number" required>
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
          </div>
          
          <div class="form-group">
            <label for="state">Select Your State:</label>
            <select id="state" name="state" required>
              <option value="" disabled selected>Select a State/Union Territory</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
              <option value="Bihar">Bihar</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Kerala">Kerala</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="West Bengal">West Bengal</option>
            </select>
          </div>

          <div class="form-group">
            <label for="role">Register as:</label>
            <select id="role" name="role" required>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <button type="submit" class="btn">Signup</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a>.</p>
      </section>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Polling Booth System | Secure and Simple Voting!</p>
  </footer>

  <script>
    document.getElementById("signup-form").addEventListener("submit", function(e) {
      let password = document.getElementById("password").value;
      let confirmPassword = document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        e.preventDefault();
        alert("Passwords do not match!");
      }
    });
  </script>

</body>
</html>
