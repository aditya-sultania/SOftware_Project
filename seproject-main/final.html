<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit</title>
    <style>
        body {
            background-color: #f4f4f9;
            color: #333;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .message-box {
            background-color: #ffffff;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .message-box h2 {
            color: #4CAF50;
            margin-top: 0;
        }
        .message-box p {
            font-size: 1rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 1.5rem;
        }
        .message-box:hover {
            transform: translateY(-5px);
        }
        .home-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .home-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <h2>Submitted</h2>
        <p>Thank you for casting your vote! Your response has been successfully recorded. Your voice matters—stay engaged and make a difference!</p>
        <a href="index.html" class="home-button">Back to Home</a>
    </div>
</body>
</html>
